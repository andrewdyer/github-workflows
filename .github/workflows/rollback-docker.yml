name: Rollback / Docker

on:
  workflow_call:
    inputs:
      image:
        description: Fully qualified image name without a tag
        required: true
        type: string
      version:
        description: Version to roll back to (e.g. "1.2.3")
        required: true
        type: string
    outputs:
      image:
        description: Fully qualified container image name
        value: ${{ jobs.setup.outputs.image }}
      version:
        description: Version to roll back to
        value: ${{ jobs.setup.outputs.version }}

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.resolve.outputs.image }}
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Validate inputs
        run: |
          if [[ -z "${{ inputs.version }}" ]]; then
            echo "❌ Missing required input: version"
            exit 1
          fi

          echo "Image: ${{ inputs.image }}"
          echo "Rollback version: ${{ inputs.version }}"

      - name: Resolve image name and version
        id: resolve
        run: |
          echo "image=${{ inputs.image }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
