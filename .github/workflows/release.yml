name: Release

on:
  workflow_call:
    inputs:
      config-file:
        description: Path to the Release Please config file
        required: false
        type: string
        default: '.github/release-please-config.json'
      manifest-file:
        description: Path to the Release Please manifest file
        required: false
        type: string
        default: '.github/.release-please-manifest.json'
    secrets:
      release-please-token:
        required: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.release-please-token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
