name: Publish / Docker

on:
  workflow_call:
    inputs:
      version:
        description: Image version tag to publish (e.g. "1.2.3")
        required: true
        type: string
      docker-registry:
        description: Container registry to push images to
        required: false
        type: string
        default: 'ghcr.io'
      docker-file:
        description: Path to the Dockerfile
        required: false
        type: string
        default: 'Dockerfile'
      docker-context:
        description: Docker build context path
        required: false
        type: string
        default: '.'
      image:
        description: Fully qualified image name without a tag
        required: true
        type: string
      build-args:
        description: Optional newline-separated Docker build arguments
        required: false
        type: string
        default: ''
      build-secret-id:
        description: Optional BuildKit secret identifier
        required: false
        type: string
        default: ''
      push-latest-tag:
        description: Whether to push the latest tag alongside the version tag
        required: false
        type: boolean
        default: true
      dispatch-deploy:
        description: Whether to fire a repository_dispatch event after a successful image push
        required: false
        type: boolean
        default: false
      deploy-event-type:
        description: The repository_dispatch event type to fire
        required: false
        type: string
        default: 'deploy'
      deploy-owner:
        description: >
          Owner of the repository to dispatch to. When empty, defaults to
          the owner of the calling repository.
        required: false
        type: string
        default: ''
      deploy-repo:
        description: >
          Repository name to dispatch to. When empty, defaults to the
          calling repository.
        required: false
        type: string
        default: ''
    secrets:
      registry-username:
        required: false
      registry-token:
        required: false
      build-secret:
        required: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.docker-registry }}
          username: ${{ secrets.registry-username != '' && secrets.registry-username || github.actor }}
          password: ${{ secrets.registry-token != '' && secrets.registry-token || github.token }}

      - name: Validate build secret
        env:
          BUILD_SECRET: ${{ secrets.build-secret }}
        run: |
          if [[ -n "${{ inputs.build-secret-id }}" && -z "$BUILD_SECRET" ]]; then
            echo "❌ build-secret must be provided when build-secret-id is set"
            exit 1
          fi

          if [[ -z "${{ inputs.build-secret-id }}" && -n "$BUILD_SECRET" ]]; then
            echo "❌ build-secret-id must be set when build-secret is provided"
            exit 1
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.docker-file }}
          push: true
          tags: |
            ${{ inputs.image }}:${{ inputs.version }}
            ${{ inputs.push-latest-tag && format('{0}:latest', inputs.image) || '' }}
          build-args: ${{ inputs.build-args }}
          secrets: ${{ inputs.build-secret-id != '' && format('{0}={1}', inputs.build-secret-id, secrets.build-secret) || '' }}

      - name: Dispatch deployment
        if: inputs.dispatch-deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OWNER="${{ inputs.deploy-owner != '' && inputs.deploy-owner || github.repository_owner }}"
          REPO="${{ inputs.deploy-repo != '' && inputs.deploy-repo || github.event.repository.name }}"

          curl --fail --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/${REPO}/dispatches" \
            -d "{\"event_type\":\"${{ inputs.deploy-event-type }}\",\"client_payload\":{\"image\":\"${{ inputs.image }}\",\"version\":\"${{ inputs.version }}\"}}"
